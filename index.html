    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fonts are requested here rather than @imported from index.css, so the

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500,400&f[]=satoshi@700,500,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>Naman Goel - Portfolio</title>
    <meta
      name="description"
      content="Naman Goel - Computer Science undergrad at VIPS, Delhi. I build full-stack and AI products, compete at hackathons, and help run tech communities."
    />
    <meta name="author" content="Naman Goel" />
    <meta name="theme-color" content="#0B1120" />

    <meta property="og:site_name" content="Naman Goel" />
    <meta property="og:title" content="Naman Goel - Portfolio" />
    <meta
      property="og:description"
      content="CSE undergrad at VIPS, Delhi. Builder, hackathon winner and tech community lead."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
